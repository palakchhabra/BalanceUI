<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Balance Scales Icon (⚖️) -->
  <g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top horizontal bar -->
    <line x1="20" y1="20" x2="80" y2="20"/>
    
    <!-- Center vertical support -->
    <line x1="50" y1="20" x2="50" y2="45"/>
    
    <!-- Left scale -->
    <line x1="20" y1="20" x2="20" y2="50"/>
    <ellipse cx="20" cy="65" rx="15" ry="10" fill="#000000"/>
    <line x1="5" y1="65" x2="35" y2="65" stroke-width="4"/>
    
    <!-- Right scale -->
    <line x1="80" y1="20" x2="80" y2="50"/>
    <ellipse cx="80" cy="65" rx="15" ry="10" fill="#000000"/>
    <line x1="65" y1="65" x2="95" y2="65" stroke-width="4"/>
  </g>
</svg>

