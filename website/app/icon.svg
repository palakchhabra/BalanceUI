<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Balance Scales Icon (⚖️) - Favicon Optimized -->
  
  <!-- Top horizontal beam -->
  <rect x="12" y="10" width="76" height="10" rx="5" fill="#000000"/>
  
  <!-- Center vertical support -->
  <rect x="45" y="20" width="10" height="35" rx="5" fill="#000000"/>
  
  <!-- Left hanging chain -->
  <line x1="20" y1="20" x2="20" y2="52" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Left scale pan -->
  <ellipse cx="20" cy="62" rx="18" ry="14" fill="#000000"/>
  <line x1="2" y1="62" x2="38" y2="62" stroke="#ffffff" stroke-width="2.5" opacity="0.4"/>
  
  <!-- Right hanging chain -->
  <line x1="80" y1="20" x2="80" y2="52" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right scale pan -->
  <ellipse cx="80" cy="62" rx="18" ry="14" fill="#000000"/>
  <line x1="62" y1="62" x2="98" y2="62" stroke="#ffffff" stroke-width="2.5" opacity="0.4"/>
</svg>

