name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install optional dependencies (fix Rollup)
      run: npm install --include=optional --no-save
    
    - name: Build
      run: npm run build
    
    - name: Type Check
      run: npm run build:types
    
    - name: Lint CSS
      run: npm run lint:css:check
    
    - name: Validate Package
      run: npm run validate
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: dist
        path: dist/
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install optional dependencies (fix Rollup)
      run: npm install --include=optional --no-save

    - name: Run Unit Tests
      run: npm run test:run
    
    - name: Run CSS Auto Detection Tests
      run: npm run test:css-auto
    
    - name: Upload Test Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-coverage
        path: coverage/
        retention-days: 30
        if-no-files-found: ignore

  visual-tests:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install optional dependencies (fix Rollup)
      run: npm install --include=optional --no-save

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    
    - name: Build Storybook
      run: npm run build-storybook
      continue-on-error: true
    
    - name: Run Playwright Visual Tests
      run: npm run test:visual
      env:
        CI: true
    
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
        include-hidden-files: true
    
    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-screenshots
        path: test-results/**/*.png
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Upload Videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-videos
        path: test-results/**/*.webm
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Upload Traces
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-traces
        path: test-results/**/*.zip
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/index.html
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Check if test results exist
          const resultsPath = 'test-results/results.json';
          if (fs.existsSync(resultsPath)) {
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const stats = results.stats || {};
            
            const comment = `## 🎭 Playwright Test Results
            
            **Status**: ${stats.failures === 0 ? '✅ All tests passed' : '❌ Some tests failed'}
            
            - **Total**: ${stats.total || 0}
            - **Passed**: ${stats.passed || 0}
            - **Failed**: ${stats.failures || 0}
            - **Skipped**: ${stats.skipped || 0}
            
            📊 [View HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
