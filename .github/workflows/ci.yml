name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Validate package
        run: npm run validate

  build-website:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build core package
        run: |
          cd ${{ github.workspace }}
          npm ci
          npm run build

      - name: Pack core package
        run: |
          cd ${{ github.workspace }}
          npm pack
          mv balanceui-core-*.tgz ../

      - name: Install website dependencies
        run: |
          cd balanceui-website
          npm install

      - name: Build website
        run: |
          cd balanceui-website
          npm install ../balanceui-core-*.tgz
          npm run build

