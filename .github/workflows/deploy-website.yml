name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build core package
        run: |
          npm run build
          npm pack
          TARBALL=$(ls balanceui-core-*.tgz | head -1)
          if [ -z "$TARBALL" ]; then
            echo "Error: Tarball not created"
            ls -la
            exit 1
          fi
          echo "TARBALL_NAME=$TARBALL" >> $GITHUB_ENV
          echo "TARBALL_PATH=$(pwd)/$TARBALL" >> $GITHUB_ENV
          echo "Tarball created: $TARBALL at $(pwd)"
          ls -la $TARBALL
          # Only copy if the name doesn't match the expected name
          if [ "$TARBALL" != "balanceui-core-1.0.0.tgz" ]; then
            cp "$TARBALL" "$(pwd)/balanceui-core-1.0.0.tgz"
            echo "Copied to balanceui-core-1.0.0.tgz"
          else
            echo "Tarball already has expected name: balanceui-core-1.0.0.tgz"
          fi
          # Verify expected file exists
          ls -la balanceui-core-1.0.0.tgz
          pwd

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Clean Vercel directory
        working-directory: ./website
        run: |
          rm -rf .vercel
        continue-on-error: true

      - name: Verify tarball exists before install
        run: |
          # Verify the tarball exists in workspace root
          echo "Checking for tarball at: ${{ github.workspace }}/balanceui-core-1.0.0.tgz"
          if [ ! -f "${{ github.workspace }}/balanceui-core-1.0.0.tgz" ]; then
            echo "❌ Error: balanceui-core-1.0.0.tgz not found in workspace root"
            echo "Workspace: ${{ github.workspace }}"
            echo "Current directory: $(pwd)"
            echo "Listing workspace contents:"
            ls -la "${{ github.workspace }}/" || echo "Failed to list workspace"
            echo "Looking for any tarball files:"
            ls -la "${{ github.workspace }}/"*.tgz 2>/dev/null || echo "No .tgz files found"
            exit 1
          fi
          echo "✓ Tarball verified: ${{ github.workspace }}/balanceui-core-1.0.0.tgz"
          ls -lh "${{ github.workspace }}/balanceui-core-1.0.0.tgz"
          # Also verify from website directory perspective
          echo "Verifying from website directory:"
          ls -lh "../balanceui-core-1.0.0.tgz" || echo "Warning: Cannot see tarball from website directory"

      - name: Link Vercel Project (if IDs provided)
        working-directory: ./website
        run: |
          if [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "Linking Vercel project using provided IDs"
            mkdir -p .vercel
            echo "{\"projectId\":\"${{ secrets.VERCEL_PROJECT_ID }}\",\"orgId\":\"${{ secrets.VERCEL_ORG_ID }}\"}" > .vercel/project.json
            echo "Project linked successfully"
          else
            echo "No project IDs provided, Vercel will auto-discover"
          fi
        continue-on-error: true

      - name: Install website dependencies
        working-directory: ./website
        run: |
          # Verify tarball is accessible from website directory
          if [ ! -f "../balanceui-core-1.0.0.tgz" ]; then
            echo "❌ Error: Cannot find tarball from website directory"
            echo "Current directory: $(pwd)"
            echo "Looking for: ../balanceui-core-1.0.0.tgz"
            echo "Parent directory contents:"
            ls -la ../ || echo "Failed to list parent"
            exit 1
          fi
          echo "✓ Tarball found, proceeding with installation"
          npm install --legacy-peer-deps

      - name: Build website
        working-directory: ./website
        run: npm run build
        env:
          VERCEL: 1

      - name: Deploy Project to Vercel
        id: vercel-deploy
        working-directory: ./website
        run: |
          export VERCEL_TOKEN="${{ secrets.VERCEL_TOKEN }}"
          export VERCEL_NON_INTERACTIVE=1
          
          # Deploy to production (--prod flag, no --yes needed with VERCEL_NON_INTERACTIVE)
          echo "Deploying to Vercel production..."
          DEPLOY_OUTPUT=$(vercel --prod --token="$VERCEL_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT"
          
          # Extract deployment URL from output (try multiple patterns)
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1 || echo "")
          if [ -z "$DEPLOY_URL" ]; then
            # Try alternative pattern
            DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^\s]+vercel[^\s]*' | head -1 || echo "")
          fi
          
          if [ -n "$DEPLOY_URL" ]; then
            echo "deployment-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
            echo "preview-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
            echo "✅ Deployment successful: $DEPLOY_URL"
          else
            echo "⚠️ Warning: Could not extract deployment URL from output"
            echo "Full output saved above for debugging"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_NON_INTERACTIVE: '1'

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Website deployed to Vercel!\n\nPreview: ${{ steps.vercel-deploy.outputs.preview-url }}\nProduction: ${{ steps.vercel-deploy.outputs.preview-url }}'
            })

