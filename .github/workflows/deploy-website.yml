name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build core package
        run: |
          npm run build
          npm pack
          TARBALL=$(ls balanceui-core-*.tgz | head -1)
          echo "TARBALL_NAME=$TARBALL" >> $GITHUB_ENV
          echo "Tarball created: $TARBALL"
          ls -la $TARBALL

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project
        working-directory: ./website
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"${{ secrets.VERCEL_PROJECT_ID }}\",\"orgId\":\"${{ secrets.VERCEL_ORG_ID }}\"}" > .vercel/project.json
        continue-on-error: true

      - name: Pull Vercel Environment Information
        id: vercel-pull
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--force'
          working-directory: ./website
        env:
          VERCEL_NON_INTERACTIVE: '1'

      - name: Install website dependencies
        working-directory: ./website
        run: |
          npm install --legacy-peer-deps
          # Install the tarball, bypassing integrity checks since it's freshly created
          npm install --legacy-peer-deps ../balanceui-core-*.tgz --force --no-package-lock

      - name: Build website
        working-directory: ./website
        run: npm run build
        env:
          VERCEL: 1

      - name: Deploy Project to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --force'
          working-directory: ./website
        env:
          VERCEL_NON_INTERACTIVE: '1'

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Website deployed to Vercel!\n\nPreview: ${{ steps.vercel-deploy.outputs.preview-url }}\nProduction: ${{ steps.vercel-deploy.outputs.preview-url }}'
            })

