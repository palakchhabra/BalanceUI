name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build core package
        run: |
          npm run build
          npm pack
          TARBALL=$(ls balanceui-core-*.tgz | head -1)
          if [ -z "$TARBALL" ]; then
            echo "Error: Tarball not created"
            ls -la
            exit 1
          fi
          echo "TARBALL_NAME=$TARBALL" >> $GITHUB_ENV
          echo "TARBALL_PATH=$(pwd)/$TARBALL" >> $GITHUB_ENV
          echo "Tarball created: $TARBALL at $(pwd)"
          ls -la $TARBALL
          # Always copy to expected name for website package.json
          cp "$TARBALL" "$(pwd)/balanceui-core-1.0.0.tgz"
          echo "Copied to balanceui-core-1.0.0.tgz"
          ls -la balanceui-core-1.0.0.tgz
          pwd

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Clean Vercel directory
        working-directory: ./website
        run: |
          rm -rf .vercel
        continue-on-error: true

      - name: Pull Vercel Environment Information
        id: vercel-pull
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || '' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || '' }}
          vercel-args: 'pull --yes'
          working-directory: ./website
        env:
          VERCEL_NON_INTERACTIVE: '1'
        continue-on-error: true

      - name: Verify tarball exists
        run: |
          # Verify the tarball exists in workspace root
          if [ ! -f "${{ github.workspace }}/balanceui-core-1.0.0.tgz" ]; then
            echo "Error: balanceui-core-1.0.0.tgz not found in workspace root"
            echo "Workspace: ${{ github.workspace }}"
            echo "Listing workspace contents:"
            ls -la "${{ github.workspace }}/" || echo "Failed to list workspace"
            echo "Looking for any tarball files:"
            ls -la "${{ github.workspace }}/"*.tgz 2>/dev/null || echo "No .tgz files found"
            exit 1
          fi
          echo "✓ Tarball verified: ${{ github.workspace }}/balanceui-core-1.0.0.tgz"
          ls -lh "${{ github.workspace }}/balanceui-core-1.0.0.tgz"

      - name: Install website dependencies
        working-directory: ./website
        run: |
          npm install --legacy-peer-deps

      - name: Build website
        working-directory: ./website
        run: npm run build
        env:
          VERCEL: 1

      - name: Deploy Project to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || '' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || '' }}
          vercel-args: '--prod --yes'
          working-directory: ./website
        env:
          VERCEL_NON_INTERACTIVE: '1'

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Website deployed to Vercel!\n\nPreview: ${{ steps.vercel-deploy.outputs.preview-url }}\nProduction: ${{ steps.vercel-deploy.outputs.preview-url }}'
            })

